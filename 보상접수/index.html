<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>런드리고 보상 데이터 대시보드</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Global Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>데이터 처리중...</p>
    </div>

    <div class="app-container" style="flex-direction: column;">
        <!-- Top Navigation -->
        <header class="top-nav glass-panel" style="margin: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;">
            <div class="logo">
                <h2 style="font-size: 1.2rem; margin: 0; font-weight: 700; letter-spacing: -0.5px;">야간세탁운영팀 <span style="color: #3b82f6;">보상접수데이터</span></h2>
            </div>
            <ul class="nav-links" style="display: flex; flex-direction: row; gap: 1rem; margin: 0; padding: 0; list-style: none;">
                <li class="active" data-target="dashboard-view" style="padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    대시보드
                </li>
                <li data-target="input-view" style="padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    데이터 입력
                </li>
                <li data-target="table-view" style="padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="9" x2="9" y2="21"></line><line x1="15" y1="9" x2="15" y2="21"></line></svg>
                    스프레드시트
                </li>
            </ul>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Dashboard View -->
            <section id="dashboard-view" class="view active">
                <header class="view-header">
                    <h1 id="dashboard-title">보상접수 데이터 월별 취합</h1>
                    <div class="header-actions">
                        <select id="month-filter-dashboard" class="glass-select">
                            <option value="all">전체 기간</option>
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                </header>
                
                <div class="dashboard-top-row">
                    <!-- 왼쪽: 통계 카드 (세로) + 보상사유비율 -->
                    <div class="left-panel">
                        <div class="stats-col">
                            <div class="stat-card-sm glass-panel">
                                <h3>총 보상 건수</h3>
                                <p class="stat-value-sm" id="total-cases">0</p>
                            </div>
                            <div class="stat-card-sm glass-panel">
                                <h3>가장 흔한 보상 사유</h3>
                                <p class="stat-value-sm" id="top-reason">-</p>
                            </div>
                            <div class="stat-card-sm glass-panel">
                                <h3>가장 잦은 품목</h3>
                                <p class="stat-value-sm" id="top-item">-</p>
                            </div>
                        </div>
                        <div class="chart-card glass-panel reason-chart-card">
                            <h3>보상 사유 비율</h3>
                            <div class="chart-container" style="height: 280px;">
                                <canvas id="reasonChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- 오른쪽: 품목별 보상 건수 (크게) -->
                    <div class="chart-card glass-panel item-chart-card">
                        <h3>품목별 보상 건수</h3>
                        <div class="chart-container" style="height: 420px;">
                            <canvas id="itemChart"></canvas>
                        </div>
                    </div>
                </div>



                <div class="insight-box glass-panel full-width" style="margin-top: 1.5rem; padding: 1.5rem; background: rgba(59, 130, 246, 0.05); border-left: 4px solid #3b82f6;">
                    <h3 style="margin-top: 0; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        월간 운영 인사이트 — 중복 원인 및 품목 심층 분석
                    </h3>
                    <div id="monthly-insight-text" style="line-height: 1.6; font-size: 0.95rem; color: #cbd5e1;">데이터를 분석 중입니다...</div>
                </div>
            </section>

            <!-- Input View -->
            <section id="input-view" class="view">
                <header class="view-header">
                    <h1>보상 내역 입력</h1>
                    <p class="subtitle">슬랙 등의 접수 양식을 그대로 복사해서 붙여넣으세요.</p>
                </header>
                
                <div class="input-container glass-panel">
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label for="date-input" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">등록일 (직접 지정)</label>
                        <input type="date" id="date-input" class="glass-select" style="width: 100%; margin-bottom: 1rem; color: white;">
                    </div>
                    <textarea id="raw-input" placeholder="-회원카드: FX0XZ3JW&#10;-최초 수거일 바코드 및 품목명: &#10;CFAB00103165 / 재킷&#10;..."></textarea>
                    <button id="parse-btn" class="primary-btn">데이터 분석 및 저장</button>
                    
                    <div id="parse-result" class="parse-result hidden">
                        <h3>분석 결과 확인</h3>
                        <div class="result-grid" id="result-grid">
                            <!-- Populated by JS -->
                        </div>
                        <button id="confirm-save-btn" class="success-btn">이대로 저장하기</button>
                        <button id="cancel-save-btn" class="ghost-btn">취소</button>
                    </div>
                </div>
            </section>

            <!-- Table View -->
            <section id="table-view" class="view">
                <header class="view-header">
                    <h1>스프레드시트 뷰</h1>
                    <div class="header-actions">
                        <select id="month-filter-table" class="glass-select">
                            <option value="all">전체 기간</option>
                            <!-- Options will be populated by JS -->
                        </select>
                        <button id="export-excel-btn" class="secondary-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Excel 다운로드
                        </button>
                    </div>
                </header>
                
                <div class="table-container glass-panel">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>날짜(입력일)</th>
                                <th>바코드</th>
                                <th>보상 접수 사유</th>
                                <th>품목명</th>
                                <th>보상 접수 경로</th>
                                <th>접수자</th>
                                <th>액션</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
